<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | XMAXIFY Control Portal</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #060d1a; color: #f1f5f9; }
    #three-bg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; opacity: 0.6; }
    .glass-card-3d { background: rgba(10, 24, 48, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(0, 168, 107, 0.2); }
    .glass-input { background: rgba(6, 13, 26, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

  <canvas id="three-bg"></canvas>

  <div class="glass-card-3d max-w-md w-full rounded-3xl p-8 shadow-2xl relative z-10 space-y-6 border border-emerald-500/30">
    <!-- Brand Logo -->
    <div class="text-center space-y-3">
      <div class="bg-white p-2 rounded-2xl inline-block mx-auto shadow-xl shadow-emerald-500/20">
        <img src="logo.png" alt="XMAXIFY Logo" class="h-12 w-auto object-contain">
      </div>
      <div>
        <h2 class="text-2xl font-black text-white">XMAXIFY Admin Portal</h2>
        <p class="text-[10px] tracking-widest uppercase text-emerald-400 font-bold">MAXIMIZE YOUR POTENTIAL</p>
      </div>
      <p class="text-xs text-slate-400">Restricted staff access for Lead Scraping & WhatsApp AI Control</p>
    </div>

    <!-- Credentials Card & 1-Click Auto Fill -->
    <div class="p-3.5 bg-[#09182d] border border-emerald-500/30 rounded-2xl text-xs space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-emerald-400 font-bold flex items-center gap-1.5">
          <i class="fa-solid fa-key"></i> Aapka Login & Password:
        </span>
        <button type="button" onclick="autoFill()" class="px-2.5 py-1 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 rounded-lg text-[10px] font-bold transition">
          1-Click Auto Fill
        </button>
      </div>
      <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-300 font-mono">
        <div class="bg-black/50 p-2 rounded-lg border border-slate-800">User: <b class="text-white">admin</b></div>
        <div class="bg-black/50 p-2 rounded-lg border border-slate-800">Pass: <b class="text-white">xmaxify2026</b></div>
      </div>
    </div>

    <!-- Error Alert -->
    <div id="errorAlert" class="hidden p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-xs text-red-300 flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span id="errorText">Invalid username or password</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
          <input type="text" id="username" value="admin" required class="glass-input w-full pl-9 pr-3.5 py-2.5 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500" placeholder="admin">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
          <input type="password" id="password" value="xmaxify2026" required class="glass-input w-full pl-9 pr-3.5 py-2.5 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" id="loginBtn" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-emerald-500/25 transition">
        Sign In to Admin Panel
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="index.html" class="text-xs text-slate-500 hover:text-emerald-400 transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> Back to XMAXIFY Public Website
      </a>
    </div>
  </div>

  <script>
    function autoFill() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'xmaxify2026';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');
      const alertBox = document.getElementById('errorAlert');

      btn.disabled = true;
      btn.innerText = 'Verifying credentials...';
      alertBox.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('xmaxify_token', data.token);
          window.location.href = 'admin.html';
        } else {
          alertBox.classList.remove('hidden');
          document.getElementById('errorText').innerText = data.error || 'Invalid credentials';
          btn.disabled = false;
          btn.innerText = 'Sign In to Admin Panel';
        }
      } catch (err) {
        alertBox.classList.remove('hidden');
        document.getElementById('errorText').innerText = 'Network error: ' + err.message;
        btn.disabled = false;
        btn.innerText = 'Sign In to Admin Panel';
      }
    }

    // 3D Canvas Background in Navy & Green
    const canvas = document.getElementById('three-bg');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const count = 600;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 12;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({ size: 0.035, color: 0x00a86b, transparent: true, opacity: 0.75 });
    const points = new THREE.Points(geometry, material);
    scene.add(points);
    camera.position.z = 5;

    function animate() {
      requestAnimationFrame(animate);
      points.rotation.y += 0.002;
      points.rotation.x += 0.001;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
