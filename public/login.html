<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Xmaxify Control Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f1f5f9; }
    .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-input { background: rgba(11, 15, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.12); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="glass-card max-w-md w-full rounded-3xl p-8 shadow-2xl border border-slate-800 space-y-6">
    <!-- Brand -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-black text-2xl mx-auto shadow-lg shadow-emerald-500/25">
        X
      </div>
      <h2 class="text-xl font-bold text-white">Xmaxify Admin Portal</h2>
      <p class="text-xs text-slate-400">Restricted access for authorized staff only</p>
    </div>

    <!-- Error Alert -->
    <div id="errorAlert" class="hidden p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-xs text-red-300 flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span id="errorText">Invalid username or password</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
          <input type="text" id="username" required class="glass-input w-full pl-9 pr-3.5 py-2.5 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500" placeholder="admin">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
          <input type="password" id="password" required class="glass-input w-full pl-9 pr-3.5 py-2.5 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" id="loginBtn" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-emerald-500/25 transition">
        Sign In to Admin Panel
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition flex items-center justify-center gap-1">
        <i class="fa-solid fa-arrow-left"></i> Back to Xmaxify Homepage
      </a>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');
      const alertBox = document.getElementById('errorAlert');

      btn.disabled = true;
      btn.innerText = 'Verifying...';
      alertBox.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('xmaxify_token', data.token);
          window.location.href = '/admin';
        } else {
          alertBox.classList.remove('hidden');
          document.getElementById('errorText').innerText = data.error || 'Invalid credentials';
          btn.disabled = false;
          btn.innerText = 'Sign In to Admin Panel';
        }
      } catch (err) {
        alertBox.classList.remove('hidden');
        document.getElementById('errorText').innerText = 'Network error: ' + err.message;
        btn.disabled = false;
        btn.innerText = 'Sign In to Admin Panel';
      }
    }
  </script>
</body>
</html>
